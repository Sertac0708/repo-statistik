# Wöchentliche Sammlung der GitHub-Zugriffszahlen (Aufrufe, Klone, Verweise, Sterne) für die Repos
# in repos.txt. GitHub behält Traffic nur 14 Tage; werkzeuge/sammeln.py hebt die Tageswerte in
# daten/<repo>.json auf, zeichnet grafik/<repo>.svg und schreibt README.md neu. Läuft auf GitHub, nicht auf dem Mac.
# Von Hand starten: Actions -> „Statistik sammeln“ -> Run workflow.
# Braucht das Secret STATISTIK_TOKEN: fein abgestufter Token, nur lesend (Administration + Metadata),
# nur für die gelisteten Repos. Fehlt er, schlägt der Lauf mit klarer Meldung fehl (GitHub mailt).
# Heartbeat (anonym, siehe README) abschalten: Repo-Variable DO_NOT_TRACK=1 (Settings -> Variables).
name: Statistik sammeln

on:
  schedule:
    - cron: "0 6 * * 1"   # montags 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sammeln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Zahlen holen
        env:
          STATISTIK_TOKEN: ${{ secrets.STATISTIK_TOKEN }}
          DO_NOT_TRACK: ${{ vars.DO_NOT_TRACK }}
          STATISTIK_HEARTBEAT: ${{ vars.STATISTIK_HEARTBEAT }}
        run: python3 werkzeuge/sammeln.py
      - name: Abzeichen der aktiven Installationen holen (nur im Ursprungs-Repo)
        if: github.repository == 'Sertac0708/repo-statistik'
        run: |
          curl -fsS --max-time 40 "https://heartbeat-production-40b4.up.railway.app/badge.svg" -o grafik/installationen.svg || echo "Abzeichen (de) nicht geholt"
          curl -fsS --max-time 40 "https://heartbeat-production-40b4.up.railway.app/badge.svg?lang=en" -o grafik/installationen-en.svg || echo "Abzeichen (en) nicht geholt"
      - name: Änderungen einchecken
        run: |
          git config user.name "statistik-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add daten grafik README.md README.de.md
          if git diff --cached --quiet; then
            echo "Keine Änderungen."
            exit 0
          fi
          git commit -m "Statistik $(date -u +%Y-%m-%d)"
          git push
